name: Release

# Bei jedem Versions-Tag (z. B. v1.0.0) wird ein ZIP gebaut und als
# Release-Datei angehängt. Der Link "neueste Version" zeigt immer darauf:
# https://github.com/<besitzer>/belegabruf/releases/latest

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Dieselben Prüfungen wie bei jedem PR (tests.yml) — erst danach wird gebaut.
  tests:
    name: Tests
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  zip:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Version im Tag und in pyproject.toml vergleichen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -m1 '^version' programm/pyproject.toml | cut -d'"' -f2)
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG passt nicht zu pyproject.toml ($VERSION)"; exit 1
          fi

      - name: ZIP bauen
        run: |
          NAME="belegabruf-${GITHUB_REF_NAME}"
          # Oben nur die zwei Starter; alles andere in Ordnern (README und LICENSE nach Doku/).
          mkdir -p "dist/$NAME/programm" "dist/$NAME/Fehlersuche" "dist/$NAME/Doku"
          cp "Belegabruf Mac.command" "Belegabruf Windows.cmd" "dist/$NAME/"
          cp Fehlersuche/* "dist/$NAME/Fehlersuche/"
          cp README.md LICENSE "dist/$NAME/Doku/"
          # .python-version: Die Starter richten genau diese Python-Version ein (nicht die neueste).
          cp -r programm/belegabruf programm/pyproject.toml programm/uv.lock programm/.python-version "dist/$NAME/programm/"
          find "dist/$NAME" -name "__pycache__" -type d -prune -exec rm -rf {} +
          chmod +x "dist/$NAME/"*.command "dist/$NAME/Fehlersuche/"*.command
          (cd dist && zip -r -X "$NAME.zip" "$NAME")
          # Dasselbe ZIP mit festem Namen: …/releases/latest/download/belegabruf.zip zeigt immer
          # auf die neueste Version (für die Ein-Zeilen-Einrichtung), dazu seine Prüfsumme.
          cp "dist/$NAME.zip" dist/belegabruf.zip
          (cd dist && sha256sum belegabruf.zip > belegabruf.zip.sha256)
          cp installieren.sh installieren.ps1 dist/

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > dist/notizen.md <<'NOTIZEN'
          **Einrichten und Update mit einer Zeile** (empfohlen, ohne Sicherheitsmeldung):

          Mac, im Programm „Terminal“:

              curl -fsSL https://github.com/balazskinal/belegabruf/releases/latest/download/installieren.sh | bash

          Windows, in „PowerShell“:

              irm https://github.com/balazskinal/belegabruf/releases/latest/download/installieren.ps1 | iex

          Das lädt die neueste Version, prüft ihre Prüfsumme, legt sie in den Programme-Ordner deines
          Benutzerkontos (Mac: ~/Applications/Belegabruf, Windows: %LOCALAPPDATA%\Programs\Belegabruf mit
          Eintrag im Startmenü) und startet sie. Update: dieselbe Zeile noch einmal. Einstellungen und
          Anmeldungen bleiben erhalten (sie liegen im Datenordner).

          Oder von Hand: `belegabruf.zip` laden, auspacken, „Belegabruf Mac“ bzw. „Belegabruf Windows“
          doppelklicken. Dabei fragt macOS bzw. Windows einmal nach (siehe Doku/README.md).
          NOTIZEN
          gh release create "$GITHUB_REF_NAME" \
            "dist/belegabruf-${GITHUB_REF_NAME}.zip" dist/belegabruf.zip dist/belegabruf.zip.sha256 \
            dist/installieren.sh dist/installieren.ps1 \
            --title "Belegabruf ${GITHUB_REF_NAME}" \
            --notes-file dist/notizen.md
