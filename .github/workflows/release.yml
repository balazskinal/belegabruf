name: Release

# Bei jedem Versions-Tag (z. B. v1.0.0) wird ein ZIP gebaut und als
# Release-Datei angehängt. Der Link "neueste Version" zeigt immer darauf:
# https://github.com/<besitzer>/belegabruf/releases/latest

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version im Tag und in pyproject.toml vergleichen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -m1 '^version' programm/pyproject.toml | cut -d'"' -f2)
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG passt nicht zu pyproject.toml ($VERSION)"; exit 1
          fi

      - uses: astral-sh/setup-uv@v6
      - name: Browser für die Oberflächen-Tests
        working-directory: programm
        run: uv run --group dev playwright install --no-shell --with-deps chromium

      - name: Tests
        working-directory: programm
        run: uv run --group dev pytest -q

      - name: ZIP bauen
        run: |
          NAME="belegabruf-${GITHUB_REF_NAME}"
          # Oben nur die zwei Starter; alles andere in Ordnern (README und LICENSE nach Doku/).
          mkdir -p "dist/$NAME/programm" "dist/$NAME/Fehlersuche" "dist/$NAME/Doku"
          cp "Belegabruf Mac.command" "Belegabruf Windows.cmd" "dist/$NAME/"
          cp Fehlersuche/* "dist/$NAME/Fehlersuche/"
          cp README.md LICENSE "dist/$NAME/Doku/"
          cp -r programm/belegabruf programm/pyproject.toml programm/uv.lock "dist/$NAME/programm/"
          find "dist/$NAME" -name "__pycache__" -type d -prune -exec rm -rf {} +
          chmod +x "dist/$NAME/"*.command "dist/$NAME/Fehlersuche/"*.command
          (cd dist && zip -r -X "$NAME.zip" "$NAME")

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/belegabruf-${GITHUB_REF_NAME}.zip" \
            --title "Belegabruf ${GITHUB_REF_NAME}" \
            --notes "Herunterladen: belegabruf-${GITHUB_REF_NAME}.zip. Erster Start und Update: ZIP auspacken, im ausgepackten Ordner „Belegabruf Mac“ bzw. „Belegabruf Windows“ doppelklicken (richtet sich selbst ein). Beim Update den alten Programmordner vorher löschen. Einstellungen und Anmeldungen liegen im Datenordner und bleiben erhalten. Anleitung: Doku/README.md."
