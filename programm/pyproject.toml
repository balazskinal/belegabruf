[project]
name = "belegabruf"
version = "2.2.3"
description = "Holt Rechnungen aus eingeloggten Anbieter-Konten per Doppelklick auf den eigenen Rechner."
license = "MIT"
authors = [{ name = "Balázs Kinál" }]
# Obergrenze: PyMuPDF zieht onnxruntime nach, das es (Stand 11/2026) nur für Python 3.12–3.14 gibt.
# Ohne Grenze lud uv auf frischen Rechnern Python 3.15, und die Einrichtung scheiterte.
requires-python = ">=3.12,<3.15"
dependencies = [
    "playwright>=1.48",
    "pymupdf>=1.24",
    "keyring>=25",
]

[project.scripts]
belege = "belegabruf.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["belegabruf"]

[tool.uv]
# Eine feste Python-Version, damit Mac und Windows gleich laufen.
python-preference = "managed"

[tool.ruff]
# Stil des Projekts: 120 Zeichen je Zeile. Prüfen mit: uvx ruff check .
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM"]
# try/except/pass mit Kommentar warum bleibt lesbarer als contextlib.suppress.
ignore = ["SIM105"]

[tool.ruff.lint.per-file-ignores]
# Tests enthalten lange Beispielzeilen (Texte, Seiteninhalte).
"tests/*" = ["E501"]
